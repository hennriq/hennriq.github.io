  <link rel="icon" type="image/x-icon" href="img/ico.png">
  <link rel="shortcut icon" type="image/x-icon" href="img/ico.png">
  <script>
    (function () {
      var languages = navigator.languages || [navigator.language || navigator.userLanguage || ""];
      var language = languages.join(",").toLowerCase();
      var timezone = "";

      try {
        timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      } catch (error) {
        timezone = "";
      }

      var usePortuguese = language.indexOf("pt") === 0 ||
        language.indexOf(",pt") > -1 ||
        timezone === "America/Sao_Paulo";

      var target = usePortuguese ? "pt-br/" : "en/";
      window.location.replace(target + window.location.search + window.location.hash);
    }());
  </script>
</head>

  <main class="redirect-card">
    <img src="img/me.jpg" alt="Bruno Souza" class="profile-picture">

  </main>
