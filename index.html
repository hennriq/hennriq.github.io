  <script>
    (function () {
      var languages = navigator.languages || [navigator.language || navigator.userLanguage || ""];
      var language = languages.join(",").toLowerCase();
      var timezone = "";

      try {
        timezone = Intl.DateTimeFormat().resolvedOptions().timeZone || "";
      } catch (error) {
        timezone = "";
      }

      var usePortuguese = language.indexOf("pt") === 0 ||
        language.indexOf(",pt") > -1;
      var useSpanish = language.indexOf("es") === 0 ||
        language.indexOf(",es") > -1;

      var target = usePortuguese ? "pt-br/" :
        useSpanish ? "es/" :
          timezone === "America/Sao_Paulo" ? "pt-br/" : "en/";
      window.location.replace(target + window.location.search + window.location.hash);
    }());
